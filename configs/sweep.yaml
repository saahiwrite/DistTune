study_name: bert-finetune-sweep
direction: maximize
metric: eval/f1
n_trials: 50

pruner:
  type: median
  n_startup_trials: 5

search_space:
  learning_rate:
    type: loguniform
    low: 1.0e-6
    high: 1.0e-3
  lora_rank:
    type: categorical
    choices: [4, 8, 16, 32]
  batch_size:
    type: categorical
    choices: [16, 32, 64]
  weight_decay:
    type: uniform
    low: 0.0
    high: 0.3
  warmup_ratio:
    type: uniform
    low: 0.0
    high: 0.2
