base: ../base.yaml

model:
  name: meta-llama/Llama-2-7b-hf
  adapter: lora
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules: [q_proj, v_proj]

data:
  dataset: tatsu-lab/alpaca
  max_length: 1024
  batch_size: 4

training:
  epochs: 3
  learning_rate: 1e-4
  mixed_precision: bf16
  gradient_accumulation_steps: 8

distributed:
  strategy: fsdp

tracking:
  tags: [llama, lora, instruction-tuning]
