[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="distributed_llm_training"
version="0.2.0"
requires-python=">=3.10"
dependencies=[
    "torch>=2.2",
    "pyyaml>=6.0",
]
[project.optional-dependencies]
dev=["pytest>=8.0"]
[tool.setuptools]
packages=["src"]
[tool.pytest.ini_options]
pythonpath=["."]
